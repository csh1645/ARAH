<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>히어로 대작전</title>
  <!-- 사이트 아이콘: 이미지 파일 없이 이모지로 (없으면 브라우저가 favicon.ico 를 찾다 404 를 남긴다) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦸%3C/text%3E%3C/svg%3E">
</head>
<body>
  <main id="app">
    <!-- 메뉴 = 히어로 로비 (디자인 표준: doc/standards/design-system.md, 히어로 코믹스) -->
    <section id="menu" class="screen lobby">
      <header class="lobby-top">
        <h1 class="cx-title">히어로 대작전!</h1>
        <div class="lobby-stats">
          <span class="cx-chip cx-chip-stat">⭐ <span id="starCount">0</span></span>
          <span class="cx-chip cx-chip-stat">🦸 <span id="heroCount">0</span></span>
        </div>
        <div class="sound-toggles">
          <button id="sfxToggle" type="button" class="cx-btn sound-btn"></button>
          <button id="bgmToggle" type="button" class="cx-btn sound-btn"></button>
          <button id="voiceToggle" type="button" class="cx-btn sound-btn" aria-label="영어 목소리 바꾸기"></button>
        </div>
      </header>

      <!-- 히어로 무대: 고른 히어로(3D)와 출동 버튼 -->
      <section class="lobby-stage cx-panel">
        <div id="showcase" class="showcase" aria-hidden="true"></div>
        <div class="stage-info">
          <p id="stageTeam" class="cx-tag"></p>
          <h2 id="stageName" class="stage-name"></h2>
          <p id="stageUniverse" class="stage-universe"></p>
          <p id="stageAbility" class="cx-bubble"></p>
          <p id="nextHero" class="next-hero"></p>
          <button id="startBtn" type="button" class="cx-go">출동!</button>
        </div>
      </section>

      <section class="cx-panel">
        <h2 class="cx-label">놀이를 골라요</h2>
        <div id="modes" class="tile-row"></div>
      </section>

      <div class="lobby-cols">
        <section class="cx-panel">
          <h2 class="cx-label">과목</h2>
          <div id="subjects" class="chip-row"></div>
        </section>
        <section class="cx-panel">
          <h2 class="cx-label">단계</h2>
          <div id="levels" class="chip-row"></div>
        </section>
      </div>

      <section class="cx-panel">
        <h2 class="cx-label">히어로 도감</h2>
        <div id="heroes" class="hero-book"></div>
      </section>

      <p class="controls">
        PC: 화살표 · 스페이스 · 숫자 키 / 태블릿: 화면을 터치해요
      </p>
    </section>

    <!-- 게임 -->
    <section id="play" class="screen" hidden>
      <div id="game"></div>
      <button id="quitBtn" type="button" class="quit">그만하기</button>
      <button id="muteBtn" type="button" class="quit mute" aria-label="소리 켜기 · 끄기"></button>
      <!-- 폰을 세로로 들면 게임이 작아지므로 가로로 돌리도록 안내하고 게임을 멈춘다 -->
      <div id="rotateHint" class="rotate-hint" hidden>
        <div class="rotate-icon">📱↻</div>
        <p>폰을 <b>가로로</b> 돌려 주세요</p>
        <p class="rotate-sub">돌리면 게임이 이어져요</p>
      </div>
    </section>

    <!-- 결과 -->
    <section id="result" class="screen" hidden>
      <h1 id="resultTitle"></h1>
      <dl id="resultStats" class="stats"></dl>
      <div id="unlock" class="unlock" hidden></div>
      <h2>틀린 문제 다시 보기</h2>
      <ul id="mistakes" class="mistakes"></ul>
      <div class="result-actions">
        <button id="retryBtn" type="button" class="primary">🔁 다시 하기</button>
        <button id="menuBtn" type="button" class="secondary">🏠 메뉴로</button>
      </div>
    </section>

    <!-- 새 히어로 합류 축하: 카드를 눌러 뒤집으면 히어로가 등장한다 (ui/app.js celebrateJoin) -->
    <div id="joinOverlay" class="join-overlay" hidden>
      <div id="joinConfetti" class="join-confetti" aria-hidden="true"></div>
      <p id="joinTitle" class="join-title">새 히어로 합류!</p>
      <button id="joinCard" type="button" class="join-card" aria-label="카드를 눌러 새 히어로를 만나 봐요">
        <span class="join-face join-back">
          <span id="joinStar" class="join-star"></span>
          <span class="join-tap">눌러서 열어 봐요!</span>
        </span>
        <span id="joinFront" class="join-face join-front"></span>
      </button>
      <p id="joinLine" class="join-line" hidden></p>
      <button id="joinOk" type="button" class="primary" hidden>좋아요! 🎉</button>
    </div>
  </main>

  <!-- 진입점: 모든 스크립트는 src/main.js 가 순서대로 import 한다 (Vite 가 묶어서 내보냄) -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
